<!-- @dsCard group="Colors" --><!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_tokens.css"><style>
.row{display:flex;gap:10px;}
.sw{flex:1;height:88px;border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;}
.dot{position:absolute;top:10px;left:10px;width:9px;height:9px;border-radius:50%;}
.sw{position:relative;}
.n{font-family:var(--font-sans);font-size:12px;font-weight:600;color:var(--fg);}
.h{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-top:2px;}
</style></head><body><div class="card">
<div class="lbl" style="margin-bottom:10px;">Status · semantic</div>
<div class="row">
  <div class="sw" style="background:#1b1c1f;"><span class="dot" style="background:#5cc28d;box-shadow:0 0 8px #5cc28d;"></span><span class="n">green · online</span><span class="h">#5cc28d</span></div>
  <div class="sw" style="background:#1b1c1f;"><span class="dot" style="background:#e0a95e;"></span><span class="n">gold · warn</span><span class="h">#e0a95e</span></div>
  <div class="sw" style="background:#1b1c1f;"><span class="dot" style="background:#e0686e;"></span><span class="n">error</span><span class="h">#e0686e</span></div>
  <div class="sw" style="background:#252629;"><span class="n">user bubble</span><span class="h">#252629</span></div>
</div></div></body></html>
